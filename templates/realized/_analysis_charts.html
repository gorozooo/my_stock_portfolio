{# [FILE] _analysis_charts.html #}
{# [PATH] templates/realized/_analysis_charts.html #}
{# このファイルは何？ #}
{# - メインチャートの補助として、累積PnL推移と分布を見るチャート群です。 #}

<div class="mt-4 grid gap-4">
  <div class="rounded-[22px] border border-white/10 bg-white/5 p-3 shadow-[0_12px_30px_rgba(0,0,0,.16)]">
    <div class="flex items-start justify-between gap-3 mb-3">
      <div>
        <div class="text-[15px] font-extrabold text-slate-100">累積PnLの推移</div>
        <div class="text-[12px] leading-6 text-slate-400">
          右肩上がりなら安定感あり、途中で急失速する月があるならその原因を重点確認します。
        </div>
      </div>
    </div>
    <div class="rounded-2xl border border-white/8 bg-slate-950/40 p-2">
      <div style="height:240px">
        <canvas id="chartCumPnl" style="width:100%;height:100%"></canvas>
      </div>
    </div>
  </div>

  <div class="rounded-[22px] border border-white/10 bg-white/5 p-3 shadow-[0_12px_30px_rgba(0,0,0,.16)]">
    <div class="flex items-start justify-between gap-3 mb-3">
      <div>
        <div class="text-[15px] font-extrabold text-slate-100">月次PnLの分布</div>
        <div class="text-[12px] leading-6 text-slate-400">
          勝ち月と負け月の偏り、月次の荒さをざっくり掴むための補助チャートです。
        </div>
      </div>
    </div>
    <div class="rounded-2xl border border-white/8 bg-slate-950/40 p-2">
      <div style="height:240px">
        <canvas id="chartPnlHist" style="width:100%;height:100%"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  function ensureChartJs() {
    return new Promise((resolve) => {
      if (window.Chart) return resolve();
      const s = document.createElement('script');
      s.src = "https://cdn.jsdelivr.net/npm/chart.js";
      s.onload = resolve;
      document.head.appendChild(s);
    });
  }

  async function fetchMonthly() {
    const params = new URLSearchParams();
    const qEl = document.querySelector('#q');
    const brokerEl = document.querySelector('#brokerFilterHidden');
    const yearEl = document.querySelector('#yearFilterHidden');
    const monthEl = document.querySelector('#monthFilterHidden');

    if (qEl?.value) params.set('q', qEl.value);
    if (brokerEl?.value) params.set('broker_filter', brokerEl.value);
    if (yearEl?.value) params.set('year_filter', yearEl.value);
    if (monthEl?.value) params.set('month_filter', monthEl.value);

    const url = "{% url 'realized_chart_monthly' %}?" + params.toString();
    const res = await fetch(url, { credentials:'same-origin' });
    return await res.json();
  }

  function resizeHiDPI(canvas) {
    const ratio = Math.max(1, window.devicePixelRatio || 1);
    const r = canvas.getBoundingClientRect();
    const w = Math.round(r.width * ratio);
    const h = Math.round(r.height * ratio);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      canvas.style.width = r.width + 'px';
      canvas.style.height = r.height + 'px';
    }
  }

  function buildHistogram(values) {
    const data = (values || []).map(Number).filter(v => Number.isFinite(v));
    const n = data.length || 0;
    if (!n) return { edges: [], counts: [] };

    const min = Math.min(...data);
    const max = Math.max(...data);
    const k = Math.max(3, Math.ceil(Math.log2(n) + 1));
    const width = (max - min) / k || 1;
    const edges = Array.from({ length: k + 1 }, (_, i) => min + i * width);
    const counts = Array(k).fill(0);

    for (const v of data) {
      let idx = Math.floor((v - min) / width);
      if (idx < 0) idx = 0;
      if (idx >= k) idx = k - 1;
      counts[idx] += 1;
    }

    return { edges, counts };
  }

  let chartCum = null;
  let chartHist = null;

  function drawCum(labels, pnlCum) {
    const el = document.getElementById('chartCumPnl');
    if (!el) return;
    resizeHiDPI(el);

    const ctx = el.getContext('2d');
    if (chartCum) {
      chartCum.destroy();
      chartCum = null;
    }

    chartCum = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels || [],
        datasets: [{
          label: '📈 累積PnL',
          data: (pnlCum || []).map(Number),
          borderColor: 'rgba(234,179,8,1)',
          backgroundColor: 'rgba(234,179,8,0.12)',
          borderWidth: 3,
          pointRadius: 2.5,
          pointHoverRadius: 4,
          tension: 0.18,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode:'index', intersect:false },
        plugins: {
          legend: { labels:{ color:'#e5e7eb' } },
          tooltip: {
            callbacks: {
              label: (ctx) => `累積PnL: ¥${Number(ctx.parsed.y ?? 0).toLocaleString()}`
            }
          }
        },
        scales: {
          x: {
            ticks:{ color:'#cbd5e1' },
            grid:{ color:'rgba(148,163,184,0.10)' }
          },
          y: {
            ticks:{
              color:'#cbd5e1',
              callback:v=>'¥' + Number(v).toLocaleString()
            },
            grid:{ color:'rgba(148,163,184,0.10)' }
          }
        }
      }
    });
  }

  function drawHist(pnl) {
    const el = document.getElementById('chartPnlHist');
    if (!el) return;
    resizeHiDPI(el);

    const ctx = el.getContext('2d');
    if (chartHist) {
      chartHist.destroy();
      chartHist = null;
    }

    const { edges, counts } = buildHistogram(pnl);
    const labels = [];
    const colors = [];

    for (let i = 0; i < counts.length; i++) {
      const left = edges[i], right = edges[i + 1];
      labels.push(`¥${Math.round(left).toLocaleString()} ~ ¥${Math.round(right).toLocaleString()}`);
      const mid = (left + right) / 2;
      colors.push(mid >= 0 ? 'rgba(59,130,246,0.55)' : 'rgba(244,63,94,0.70)');
    }

    chartHist = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: '月数',
          data: counts,
          backgroundColor: colors,
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode:'index', intersect:false },
        plugins: {
          legend: { labels:{ color:'#e5e7eb' } },
          tooltip: {
            callbacks: {
              title: (items) => items?.[0]?.label || '',
              label: (ctx) => `月数: ${ctx.parsed.y ?? 0}`
            }
          }
        },
        scales: {
          x: {
            ticks:{ color:'#cbd5e1' },
            grid:{ color:'rgba(148,163,184,0.10)' }
          },
          y: {
            ticks:{ color:'#cbd5e1' },
            grid:{ color:'rgba(148,163,184,0.10)' },
            beginAtZero:true
          }
        }
      }
    });
  }

  async function drawAll(force=false) {
    await ensureChartJs();

    const el1 = document.getElementById('chartCumPnl');
    const el2 = document.getElementById('chartPnlHist');
    if (!el1 || !el2) return;

    const r1 = el1.getBoundingClientRect();
    const r2 = el2.getBoundingClientRect();
    if (!force && ((r1.width === 0 || r1.height === 0) && (r2.width === 0 || r2.height === 0))) return;

    const data = await fetchMonthly();
    drawCum(data.labels, data.pnl_cum);
    drawHist(data.pnl);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => drawAll(true), { once:true });
  } else {
    drawAll(true);
  }

  const qEl = document.querySelector('#q');
  if (qEl) {
    ['change','blur','keydown'].forEach(ev => {
      qEl.addEventListener(ev, e => {
        if (ev !== 'keydown' || e.key === 'Enter') drawAll(true);
      });
    });
  }

  document.body.addEventListener('htmx:afterSwap', e => {
    if (!e.target) return;
    if (['pnlTableWrap','pnlSummaryWrap','pnlPeriodWrap'].includes(e.target.id)) {
      drawAll(true);
    }
  });

  const io1 = new IntersectionObserver((ents) => {
    if (ents[0]?.isIntersecting) drawAll(true);
  }, { threshold:0.2 });

  const io2 = new IntersectionObserver((ents) => {
    if (ents[0]?.isIntersecting) drawAll(true);
  }, { threshold:0.2 });

  const el1 = document.getElementById('chartCumPnl');
  const el2 = document.getElementById('chartPnlHist');
  if (el1) io1.observe(el1);
  if (el2) io2.observe(el2);

  let t = null;
  window.addEventListener('resize', () => {
    clearTimeout(t);
    t = setTimeout(() => drawAll(true), 120);
  });

  window.addEventListener('pageshow', () => drawAll(true));
})();
</script>
