<!--
[FILE] _margin_to_spot_sheet.html 
[PATH] templates/realized/_margin_to_spot_sheet.html #}
  このファイルは何？
  - 現引専用の入力シート
  - 信用保有 → 現物(特定)へ移すための確認フォーム
-->

<div class="sheet" style="padding:16px; color:#e5e7eb;">
  <div class="sheet-title" style="font-weight:700; font-size:16px; margin-bottom:12px;">
    現引
  </div>

  <div style="font-size:12px; color:#94a3b8; margin-bottom:12px; line-height:1.6;">
    信用保有を <strong style="color:#e5e7eb;">現物（特定）</strong> へ移します。<br>
    この処理では <strong style="color:#e5e7eb;">実現損益は作られません</strong>。<br>
    現金台帳には <strong style="color:#e5e7eb;">現引額（出金）</strong> が記録されます。
  </div>

  <div style="border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:12px; background:rgba(255,255,255,.04); margin-bottom:12px;">
    <div style="font-weight:700; margin-bottom:6px;">{{ h.ticker }} {{ h.name }}</div>
    <div style="font-size:12px; color:#cbd5e1; line-height:1.6;">
      証券会社: {{ h.broker }}<br>
      現在口座: 信用<br>
      現引先: 特定<br>
      保有数量: {{ h.quantity }} 株<br>
      平均取得: {{ h.avg_cost }} {% if h.currency %}{{ h.currency }}{% endif %}<br>
      建玉日: {{ h.opened_at|default:"—" }}
    </div>
  </div>

  <form method="post" action="{% url 'holding_margin_to_spot_submit' h.id %}">
    {% csrf_token %}

    <div style="display:grid; gap:10px;">
      <div>
        <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:4px;">現引日</label>
        <input
          type="date"
          name="date"
          value="{{ today }}"
          style="width:100%; height:40px; border-radius:10px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#e5e7eb; padding:0 10px;"
        >
      </div>

      <div>
        <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:4px;">現引数量</label>
        <input
          type="number"
          name="qty"
          min="1"
          max="{{ h.quantity }}"
          value="{{ h.quantity }}"
          style="width:100%; height:40px; border-radius:10px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#e5e7eb; padding:0 10px;"
        >
      </div>

      <div>
        <label style="display:block; font-size:12px; color:#94a3b8; margin-bottom:4px;">メモ</label>
        <textarea
          name="memo"
          rows="3"
          placeholder="任意メモ"
          style="width:100%; border-radius:10px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:#e5e7eb; padding:10px;"
        ></textarea>
      </div>
    </div>

    <div style="display:flex; gap:8px; margin-top:14px;">
      <button
        type="submit"
        style="flex:1; height:42px; border-radius:10px; border:1px solid rgba(34,197,94,.35); background:rgba(34,197,94,.14); color:#dcfce7; font-weight:700;"
      >
        現引する
      </button>

      <button
        type="button"
        data-dismiss="sheet"
        style="flex:1; height:42px; border-radius:10px; border:1px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06); color:#e5e7eb; font-weight:700;"
      >
        閉じる
      </button>
    </div>
  </form>
</div>
