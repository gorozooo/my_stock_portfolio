<!--
[FILE] income_manage.html
[PATH] <project_root>/templates/kakeibo/income_manage.html

このファイルは何？
- 収入（月次）の入力専用画面。
- ★B案：入力画面から「登録済み一覧」を完全に消す（スッキリ特化）
- 編集/削除は「設定 → 管理（探して編集・削除） → 収入（管理）」で行う
-->
{% extends "kakeibo/base_kakeibo.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
  <section class="kb-card">
    <div class="kb-title">{{ title }}</div>

    <div class="kb-muted" style="margin-top:10px;">
       すでに登録済みのものについての編集・削除は<br>
      「設定 → 管理（探して編集・削除）」で行います。
    </div>
  </section>

  <section class="kb-card">
    <div class="kb-title">追加</div>

    <form method="post" class="kb-form">
      {% csrf_token %}
      {{ form.as_p }}

      <button class="kb-btn kb-btn-primary" type="submit">追加</button>
    </form>

    <div style="display:flex; gap:10px; margin-top:14px;">
      <a class="kb-btn" href="{% url 'kakeibo:manage_menu' %}">管理へ</a>
      <a class="kb-btn" href="{% url 'kakeibo:settings_menu' %}">設定へ</a>
    </div>
  </section>
{% endblock %}
