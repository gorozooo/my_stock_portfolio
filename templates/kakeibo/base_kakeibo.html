<!--
[FILE] base_kakeibo.html
[PATH] <project_root>/templates/kakeibo/base_kakeibo.html

このファイルは何？
- 家計簿アプリ専用の共通レイアウト（ベーステンプレ）です。
- 株アプリの base.html は使いません（完全分離）。
- CSS/JS も家計簿専用を読み込みます。
-->

{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}家計簿{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'kakeibo/css/kakeibo.css' %}">
  {% block extra_head %}{% endblock %}
</head>

<body>
  <header>
    <div class="header-inner">
      <div>
        <div class="brand">Kakeibo</div>
        <div class="sub">家計簿（別UI）</div>
      </div>
      <div>
        <a class="btn" href="/accounts/logout/">ログアウト</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'kakeibo/js/kakeibo.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
