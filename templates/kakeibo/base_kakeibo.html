<!--
[FILE] base_kakeibo.html
[PATH] <project_root>/templates/kakeibo/base_kakeibo.html

このファイルは何？
- 家計簿アプリ専用の「共通レイアウト（ベーステンプレ）」です。
- 株アプリの base.html とは完全に別物で、家計簿の画面はこれを継承します。
- ここに家計簿のヘッダー/フッター/共通CSSなどをまとめます。
-->

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}家計簿{% endblock %}</title>

  <!-- 最低限の見た目（あとで本格UIに進化させる前提） -->
  <style>
    :root {
      --bg: #0b0f14;
      --card: rgba(255,255,255,0.08);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.65);
      --border: rgba(255,255,255,0.12);
      --accent: #56ccf2;
      --danger: #ff5c7a;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 32px;
    }
    header {
      position: sticky;
      top: 0;
      backdrop-filter: blur(14px);
      background: rgba(11,15,20,0.75);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    .header-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin: 12px 0;
    }
    .muted { color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    .btn {
      display: inline-block;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      font-weight: 700;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body>
  <header>
    <div class="header-inner">
      <div>
        <div class="brand">Kakeibo</div>
        <div class="sub">家計簿（別UI）</div>
      </div>
      <div>
        <a class="btn" href="/accounts/logout/">ログアウト</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}{% endblock %}
</body>
</html>
