<!--
[FILE] base_kakeibo.html
[PATH] <project_root>/templates/kakeibo/base_kakeibo.html

このファイルは何？
- 家計簿アプリ専用の共通レイアウト（ベーステンプレ）。
- 家計簿専用の「下タブ」を使う。
- ログアウト（退出）は下タブから撤去（要求仕様）。
- 下タブのアイコンは SF Symbols 風（SVGをstaticに置き、CSS maskで描画）。
-->

{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}家計簿{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'kakeibo/css/kakeibo.css' %}">
  <link rel="stylesheet" href="{% static 'kakeibo/css/kakeibo_tab.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>

<main class="kb-wrap kb-wrap-with-tab">
  {% block content %}{% endblock %}
</main>

<!-- =========================
     家計簿専用：下タブメニュー（4タブ / ログアウトなし）
     ========================= -->
<nav class="kbtab" aria-label="家計簿メニュー">
  <a class="kbtab-btn" href="{% url 'kakeibo:dashboard' %}" data-kbtab="home" aria-label="ホーム">
    <div class="kbtab-ico"><span class="kbico kbico-home" aria-hidden="true"></span></div>
    <div class="kbtab-txt">ホーム</div>
  </a>

  <a class="kbtab-btn" href="{% url 'kakeibo:expense_create' %}" data-kbtab="expense" aria-label="支出">
    <div class="kbtab-ico"><span class="kbico kbico-minus" aria-hidden="true"></span></div>
    <div class="kbtab-txt">支出</div>
  </a>

  <a class="kbtab-btn" href="{% url 'kakeibo:income_create' %}" data-kbtab="income" aria-label="収入">
    <div class="kbtab-ico"><span class="kbico kbico-plus" aria-hidden="true"></span></div>
    <div class="kbtab-txt">収入</div>
  </a>

  <a class="kbtab-btn" href="{% url 'kakeibo:settings' %}" data-kbtab="settings" aria-label="設定">
    <div class="kbtab-ico"><span class="kbico kbico-gear" aria-hidden="true"></span></div>
    <div class="kbtab-txt">設定</div>
  </a>
</nav>

<script src="{% static 'kakeibo/js/kakeibo.js' %}" defer></script>
<script src="{% static 'kakeibo/js/kakeibo_tab.js' %}" defer></script>
{% block extra_js %}{% endblock %}
</body>
</html>
