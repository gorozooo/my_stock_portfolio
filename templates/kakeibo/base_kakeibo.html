<!--
[FILE] base_kakeibo.html
[PATH] <project_root>/templates/kakeibo/base_kakeibo.html

このファイルは何？
- 家計簿アプリ専用の共通レイアウト（ベーステンプレ）。
- 家計簿専用の「下タブ」を使う（株アプリとは混ぜない）。
- 下タブ：ホーム / 支出 / 収入 / 銀行 / 設定
- 設定タブは「設定メニュー」へ飛ばす
- Django messages を拾って「トースト表示」する
-->
{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}家計簿{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'kakeibo/css/kakeibo.css' %}?v=4">
  <link rel="stylesheet" href="{% static 'kakeibo/css/kakeibo_tab.css' %}?v=3">
  <!-- ✅ Toast -->
  <link rel="stylesheet" href="{% static 'kakeibo/css/kakeibo_toast.css' %}?v=5">

  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- ✅ Toast host（messages をここに流し込む） -->
<div class="kb-toast-host" aria-live="polite" aria-atomic="true">
  {% if messages %}
    {% for message in messages %}
      <div class="kb-toast"
           data-level="{{ message.tags|default:'info' }}"
           role="status">
        <div class="kb-toast-msg">{{ message }}</div>
        <button type="button" class="kb-toast-x" aria-label="閉じる">×</button>
      </div>
    {% endfor %}
  {% endif %}
</div>

<main class="kb-wrap kb-wrap-with-tab">
  {% block content %}{% endblock %}
</main>

<nav class="kbtab" aria-label="家計簿メニュー">
  <a class="kbtab-btn" href="{% url 'kakeibo:dashboard' %}" data-kbtab="home" aria-label="ホーム">
    <div class="kbtab-ico"><span class="kbico kbico-home"></span></div>
    <div class="kbtab-txt">ホーム</div>
  </a>

  <a class="kbtab-btn" href="{% url 'kakeibo:expense' %}" data-kbtab="expense" aria-label="支出">
    <div class="kbtab-ico"><span class="kbico kbico-minus"></span></div>
    <div class="kbtab-txt">支出</div>
  </a>

  <a class="kbtab-btn" href="{% url 'kakeibo:income' %}" data-kbtab="income" aria-label="収入">
    <div class="kbtab-ico"><span class="kbico kbico-plus"></span></div>
    <div class="kbtab-txt">収入</div>
  </a>

  <a class="kbtab-btn" href="{% url 'kakeibo:bank' %}" data-kbtab="bank" aria-label="銀行">
    <div class="kbtab-ico"><span class="kbico kbico-bank"></span></div>
    <div class="kbtab-txt">銀行</div>
  </a>

  <!-- ✅ 設定メニューへ -->
  <a class="kbtab-btn" href="{% url 'kakeibo:settings_menu' %}" data-kbtab="settings" aria-label="設定">
    <div class="kbtab-ico"><span class="kbico kbico-gear"></span></div>
    <div class="kbtab-txt">設定</div>
  </a>
</nav>

<script src="{% static 'kakeibo/js/kakeibo.js' %}" defer></script>
<script src="{% static 'kakeibo/js/kakeibo_tab.js' %}?v=2" defer></script>
<!-- ✅ Toast -->
<script src="{% static 'kakeibo/js/kakeibo_toast.js' %}?v=4" defer></script>

{% block extra_js %}{% endblock %}
</body>
</html>
