<!--
[FILE] dashboard.html
[PATH] <project_root>/templates/kakeibo/dashboard.html

このファイルは何？
- 家計簿トップ画面（/kakeibo/）のテンプレートです。
- まずは「別baseで表示できる」状態を固めます。
-->

{% extends "kakeibo/base_kakeibo.html" %}

{% block title %}家計簿ダッシュボード{% endblock %}

{% block content %}
  <div class="card">
    <h2 style="margin:0 0 6px 0;">{{ title }}</h2>
    <div class="muted">ログインOK / 権限制御OK / 別UI OK ✅</div>
  </div>

  <div class="card">
    <div style="font-weight:800; margin-bottom:8px;">次に作る画面</div>
    <div class="muted" style="line-height:1.7;">
      ・収入入力（/kakeibo/income/）<br>
      ・支出入力（/kakeibo/expense/）<br>
      ・設定（オーナー専用 /kakeibo/settings/）
    </div>
  </div>
{% endblock %}
